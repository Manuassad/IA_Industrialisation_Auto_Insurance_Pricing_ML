# Continuous Integration pipeline for the auto pricing API
name: CI Pipeline API Tarification

# Trigger workflow on pushes targeting the main branch 
on:
  push:
    branches: [ main ]

jobs:
  # Job to validate code quality, execute test suite, and check container build
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    # Check out the repository under $GITHUB_WORKSPACE
    - name: Code Checkout
      uses: actions/checkout@v4
      
    # Set up uv for ultra-fast dependency resolution and installation
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
      
    # Set up the specified Python environment
    - name: Python Setup
      uses: actions/setup-python@v5 
      with:
        python-version: '3.14' 
        
    # Install project requirements and test utilities using uv
    - name: Dependencies Installation
      run: |
        uv venv
        uv pip install -r requirements.txt
        
    # Run code check (linting, formatting, or custom check script)
    - name: Code Check
      run: ty check
        
    # Run the test suite using pytest via uv
    - name: Tests Execution
      run: uv run pytest tests/
      
    # Verify that the Dockerfile builds successfully
    - name: Docker Build Verification
      run: docker build -t api-tarification-auto:latest .